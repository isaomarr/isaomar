<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Isa Omar</title>

    <link rel="stylesheet" href="./css/output.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="antialiased relative selection:bg-cyan-500 selection:text-white bg-[#050505]">

    <!-- Background -->
    <div class="blob-1 fixed"></div>
    <div class="blob-2 fixed"></div>

    <!-- NAVBAR -->
    <nav class="fixed w-full z-50 glass border-b-0 border-white/10 top-0">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold tracking-tighter text-white neon-text-blue">ISA OMAR</a>

            <div class="hidden md:flex space-x-8 text-sm text-gray-400 font-medium">
                <a href="index.html#about" class="hover:text-cyan-400 translatable"
                    data-en="About" data-az="Haqqımda">About</a>

                <a href="index.html#projects" class="hover:text-cyan-400 translatable"
                    data-en="Projects" data-az="Layihələr">Projects</a>

                <a href="index.html#skills" class="hover:text-cyan-400 translatable"
                    data-en="Skills" data-az="Bacarıqlar">Skills</a>

                <a href="blog.html" class="text-cyan-400 translatable"
                    data-en="Blog" data-az="Bloq">Blog</a>

                <a href="index.html#contact" class="hover:text-cyan-400 translatable"
                    data-en="Contact" data-az="Əlaqə">Contact</a>
            </div>

            <div class="hidden md:flex items-center gap-6">
                <div class="flex items-center gap-2 text-sm font-semibold text-gray-400">
                    <button onclick="setLang('en')" id="btn-en"
                        class="hover:text-cyan-400 transition lang-active">EN</button>
                    <span>|</span>
                    <button onclick="setLang('az')" id="btn-az"
                        class="hover:text-cyan-400 transition">AZ</button>
                </div>

                <a href="index.html#contact"
                    class="px-5 py-2 rounded-full border border-cyan-500/50 text-cyan-400 hover:bg-cyan-500/10 text-sm font-semibold translatable"
                    data-en="Let's Talk" data-az="Əlaqə">Let's Talk</a>
            </div>
        </div>
    </nav>

    <!-- BLOG -->
    <section class="pt-32 pb-20 relative z-10">
        <div class="max-w-7xl mx-auto px-6">

            <h1 class="text-4xl md:text-5xl font-bold mb-12 text-center translatable"
                data-en="Blog" data-az="Bloq">
                Blog
            </h1>

            <div id="blogContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

        </div>
    </section>

    <!-- BLOG DATA -->
    <script src="./js/blog.js"></script>

    <!-- BLOG RENDER -->
    <script>
        const container = document.getElementById("blogContainer");

        blogPosts.forEach(post => {
            const div = document.createElement("div");

            div.className = "glass p-6 rounded-2xl border border-white/10 hover-glow cursor-pointer transition";

            div.innerHTML = `
                <h3 class="text-lg font-semibold text-white mb-2">${post.title}</h3>
                <p class="text-gray-400 text-sm mb-3">${post.desc}</p>
                <span class="text-xs text-gray-500">${post.date}</span>
            `;

            container.appendChild(div);
        });
    </script>

    <!-- LANGUAGE SCRIPT -->
    <script>
        function setLang(lang) {
            document.querySelectorAll('.translatable').forEach(el => {
                const text = el.getAttribute('data-' + lang);
                if (text) el.textContent = text;
            });

            document.getElementById('btn-en').classList.toggle('lang-active', lang === 'en');
            document.getElementById('btn-az').classList.toggle('lang-active', lang === 'az');
        }
    </script>

</body>

</html>
